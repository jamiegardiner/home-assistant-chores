repos:
  - repo: local
    hooks:
      - id: uv-lock-check
        name: Check uv.lock is up to date
        entry: uv lock --check
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check
        language: system
        types: [python]

      - id: ruff-format-check
        name: ruff format --check
        entry: uv run --frozen ruff format --check
        language: system
        types: [python]

      - id: mdformat
        name: mdformat --check
        entry: uv run --frozen mdformat --check
        language: system
        types: [markdown]

      - id: mypy
        name: mypy
        entry: uv run --frozen mypy custom_components scripts
        language: system
        pass_filenames: false
        files: \.py$

      - id: translations
        name: translations
        entry: uv run --frozen python scripts/check_translations.py
        language: system
        pass_filenames: false
        files: (strings\.json|translations/en\.json)$
