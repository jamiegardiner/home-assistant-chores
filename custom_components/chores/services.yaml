complete:
  target:
    entity:
      integration: chores
      domain: sensor
      device_class: enum
  fields:
    completed_at:
      required: false
      selector:
        datetime:

snooze:
  target:
    entity:
      integration: chores
      domain: sensor
      device_class: enum
  fields:
    value:
      required: true
      selector:
        number:
          min: 1
          max: 365
          step: 1
          mode: box
    unit:
      required: true
      selector:
        select:
          options:
            - minutes
            - hours
            - days
            - weeks

unsnooze:
  target:
    entity:
      integration: chores
      domain: sensor
      device_class: enum
